services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    image: emoblog-backend
    container_name: emoblog-backend
    ports:
      - "8080:8080"
    environment:
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-Jv8IfxQJqYw0x7k1nVYh5C3oVGT7F2m9n0GJcV5j1Yw=}
      SECURITY_JWT_EXPMINUTES: ${SECURITY_JWT_EXPMINUTES:-60}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:sqlite:db/emoblog.db}

    volumes:
      - ./db:/app/db
    restart: unless-stopped
